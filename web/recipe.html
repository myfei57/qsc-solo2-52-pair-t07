<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Recipe trials</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #f5f6f8; color: #1c1f24; }
    table { border-collapse: collapse; width: 100%; background: #fff; margin-bottom: 1.2rem; }
    th, td { border: 1px solid #d7dbe0; padding: 0.4rem 0.6rem; text-align: left; font-size: 0.9rem; }
    form { background: #fff; padding: 1rem; border: 1px solid #d7dbe0; margin-bottom: 1rem; }
    input, button { padding: 0.35rem 0.5rem; margin: 0.2rem; }
    nav a { margin-right: 0.8rem; }
    code { white-space: pre-wrap; }
  </style>
</head>
<body>
  <nav><a href="/pages/recipe">recipe</a><a href="/pages/batch">batch</a><a href="/pages/discharge">discharge</a><a href="/pages/alarms">alarms</a></nav>
  <h1>Small-pan trials and formal recipes</h1>
  <p>Promotion is per version. Production selection requires an accepted trial receipt.</p>

  <form id="trial-open">
    <input name="name" placeholder="formal recipe name" value="mix-a">
    <input name="grade" placeholder="grade" value="C30">
    <input name="sand" placeholder="sand kg/m3" value="760">
    <input name="gravel" placeholder="gravel kg/m3" value="1010">
    <input name="cement" placeholder="cement kg/m3" value="330">
    <input name="water" placeholder="water L/m3" value="175">
    <input name="moisture_ref_percent" placeholder="moisture %" value="4.5">
    <input name="prepared_by" placeholder="prepared by">
    <button type="submit">open trial pan</button>
  </form>

  <form id="trial-complete">
    <input name="trial_id" placeholder="trial id">
    <input name="approved_by" placeholder="approved by">
    <button type="submit">complete pan</button>
  </form>

  <form id="trial-receipt">
    <input name="trial_id" placeholder="trial id">
    <input name="passed" placeholder="true/false">
    <input name="report_ref" placeholder="laboratory report ref">
    <input name="content_hash" placeholder="report hash">
    <input name="issued_by" placeholder="laboratory">
    <button type="submit">attach receipt</button>
  </form>

  <form id="trial-promote">
    <input name="trial_id" placeholder="eligible trial id">
    <input name="name" placeholder="formal recipe name">
    <input name="promoted_by" placeholder="promoted by">
    <button type="submit">promote one version</button>
  </form>

  <form id="select">
    <input name="name" placeholder="formal recipe name" value="mix-a">
    <button type="submit">select for production</button>
  </form>

  <h2>Trial pans</h2>
  <table id="trials"><thead><tr><th>trial</th><th>revision</th><th>grade</th><th>status</th><th>receipt</th><th>formal source</th><th>chain</th></tr></thead><tbody></tbody></table>

  <h2>Recipe history</h2>
  <table id="recipes"><thead><tr><th>name</th><th>grade</th><th>version</th><th>selected</th><th>trial source</th></tr></thead><tbody></tbody></table>

  <script id="plant-state" type="application/json"><!--STATE--></script>
  <script>
    const state = JSON.parse(document.getElementById('plant-state').textContent || '{}');
    const trials = (state.trials && state.trials.trials) || [];
    const trialBody = document.querySelector('#trials tbody');
    for (const trial of trials) {
      const receipt = trial.receipts.length ? trial.receipts[trial.receipts.length - 1] : null;
      const row = document.createElement('tr');
      row.innerHTML = `<td>${trial.trial_id}</td><td>${trial.revision}</td><td>${trial.grade.code}</td><td>${trial.status}</td><td>${receipt ? receipt.report_ref + ' / ' + receipt.passed : ''}</td><td>${trial.promoted_recipe_name || ''} ${trial.promoted_recipe_version || ''}</td><td><button data-trial="${trial.trial_id}">view chain</button><pre></pre></td>`;
      trialBody.appendChild(row);
    }

    const recipeBody = document.querySelector('#recipes tbody');
    for (const entry of state.book.recipes) {
      const sources = entry.history.map(recipe => recipe.provenance
        ? `v${recipe.version}: ${recipe.provenance.trial_id} / ${recipe.provenance.receipt_id}`
        : `v${recipe.version}: no trial source`).join('\n');
      const row = document.createElement('tr');
      row.innerHTML = `<td>${entry.name}</td><td>${entry.current.grade.code}</td><td>${entry.current.version}</td><td>${entry.selected}</td><td><code>${sources}</code></td>`;
      recipeBody.appendChild(row);
    }

    async function post(path, form) {
      const payload = Object.fromEntries(new FormData(form).entries());
      const response = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      return response.json();
    }
    for (const [id, path] of Object.entries({
      'trial-open': '/api/trial/open',
      'trial-complete': '/api/trial/complete',
      'trial-receipt': '/api/trial/receipt',
      'trial-promote': '/api/trial/promote',
      'select': '/api/recipe/select',
    })) {
      document.getElementById(id).addEventListener('submit', async (event) => { event.preventDefault(); console.log(await post(path, event.target)); location.reload(); });
    }
    document.querySelectorAll('[data-trial]').forEach(button => button.addEventListener('click', async () => {
      const response = await fetch(`/api/trials/${button.dataset.trial}/chain`);
      button.parentElement.querySelector('pre').textContent = JSON.stringify(await response.json(), null, 2);
    }));
  </script>
</body>
</html>
